<header class="topbar" *ngIf="!isLoginPage()">

    <div class="logo">
        <a routerLink="/home" class="logo-link">
            <i data-lucide="playing-cards"></i>
            <span>Lernkarten App</span>
        </a>
    </div>

    <nav class="top-menu">

        <div class="nav-links">

            <span *ngIf="isLernkartenActive() || isThemenActive() || isQuizActive()" class="active-slider"
                [class.slider-lernkarten]="isLernkartenActive()" [class.slider-themen]="isThemenActive()"
                [class.slider-quiz]="isQuizActive()">
            </span>

            <a routerLink="/my-cards" [class.active]="isLernkartenActive()">
                Lernkarten
            </a>

            <a routerLink="/topics" [class.active]="isThemenActive()">
                Themen
            </a>

            <a routerLink="/quiz" [class.active]="isQuizActive()">
                Quiz
            </a>

        </div>

        <div class="account-wrapper">

            <button type="button" class="account-button" (click)="toggleAccount()">

                <i data-lucide="user"></i>
                <span>{{ username }}</span>

            </button>

            <div class="account-menu" *ngIf="accountOpen">

                <div class="account-header">

                    <div class="account-avatar">
                        {{ userInitial }}
                    </div>

                    <div>
                        <strong>{{ username }}</strong>
                        <span>Mein Account</span>
                    </div>

                </div>

                <div class="account-divider"></div>

                <button type="button" class="account-menu-button" (click)="openUsernameEditor()">

                    <i data-lucide="user-pen"></i>
                    <span>Namen ändern</span>

                </button>

                <div class="username-editor" *ngIf="usernameEditorOpen">

                    <input id="newUsername" name="newUsername" type="text" [(ngModel)]="newUsername"
                        placeholder="Neuer Name" maxlength="30" />

                    <button type="button" class="save-username-button" (click)="changeUsername()">

                        Speichern

                    </button>

                    <div class="username-message" *ngIf="usernameMessage" [class.success]="usernameSuccess">

                        {{ usernameMessage }}

                    </div>

                </div>

                <div class="account-divider"></div>

                <button type="button" class="delete-account-button" (click)="deleteAccount()">

                    <i data-lucide="trash-2"></i>
                    <span>Konto löschen</span>

                </button>

            </div>

        </div>

        <button type="button" class="logout-button-top" (click)="logout()">

            <i data-lucide="log-out"></i>
            <span>Ausloggen</span>

        </button>

    </nav>

</header>

<div class="app-content" [class.login-content]="isLoginPage()">

    <router-outlet></router-outlet>

</div>

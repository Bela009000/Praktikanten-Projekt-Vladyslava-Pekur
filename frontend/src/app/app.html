<div class="app-wrapper" (click)="onDocumentClick($event)">

    <header class="topbar" *ngIf="!isLoginPage()">

        <div class="logo">
            <a routerLink="/home" class="logo-link">
                <i data-lucide="playing-cards"></i>
                <span>Lernkarten App</span>
            </a>
        </div>

        <nav class="top-menu">

            <div class="nav-links">

                <span *ngIf="isLernkartenActive() || isThemenActive() || isQuizActive()" class="active-slider"
                    [class.slider-lernkarten]="isLernkartenActive()" [class.slider-themen]="isThemenActive()"
                    [class.slider-quiz]="isQuizActive()">
                </span>

                <a routerLink="/my-cards" [class.active]="isLernkartenActive()">
                    Lernkarten
                </a>

                <a routerLink="/topics" [class.active]="isThemenActive()">
                    Themen
                </a>

                <a routerLink="/quiz" [class.active]="isQuizActive()">
                    Quiz
                </a>

            </div>

            <div class="account-wrapper" (click)="$event.stopPropagation()">

                <button type="button" class="account-button" (click)="toggleAccount()">

                    
                    <div class="topbar-avatar">

                        <img *ngIf="photoURL" [src]="photoURL" alt="Avatar">

                        <span *ngIf="!photoURL">
                            {{ userInitial }}
                        </span>

                    </div>

                    <span class="topbar-username">
                        {{ username }}
                    </span>

                </button>

                <div class="account-menu" *ngIf="accountOpen">

                    <div class="account-header">

                        <div class="account-avatar-small">

                            <img *ngIf="photoURL" [src]="photoURL" alt="Avatar">

                            <span *ngIf="!photoURL">
                                {{ userInitial }}
                            </span>

                        </div>

                        <div class="account-header-info">

                            <strong>
                                {{ username }}
                            </strong>

                            <span>
                                Mein Account
                            </span>

                        </div>

                    </div>

                    <div class="account-divider"></div>

                    <button type="button" class="account-menu-button" routerLink="/account"
                        (click)="accountOpen = false">

                        <i data-lucide="user"></i>

                        <span>
                            Mein Account
                        </span>

                    </button>

                    <div class="account-divider"></div>

                    <button type="button" class="delete-account-button" (click)="deleteAccount()">

                        <i data-lucide="trash-2"></i>

                        <span>
                            Konto löschen
                        </span>

                    </button>

                </div>

            </div>
            <app-theme-toggle></app-theme-toggle>

            <button type="button" class="logout-button-top" (click)="logout()">

                <i data-lucide="log-out"></i>

                <span>
                    Ausloggen
                </span>

            </button>

        </nav>

    </header>

    <div class="app-content" [class.login-content]="isLoginPage()">

        <router-outlet></router-outlet>

    </div>

</div>

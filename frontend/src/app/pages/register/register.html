<div class="page-wrapper"
    style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;">
    <div class="register-container">
        <h2>Registrieren</h2>

        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="username">Benutzername</label>
                <input type="text" id="username" name="username" [(ngModel)]="username" />
            </div>

            <div class="form-group">
                <label for="password">Passwort</label>
                <div class="password-wrapper">

                    <input [type]="showPassword ? 'text' : 'password'" id="password" name="password"
                        [(ngModel)]="password" />

                    <button type="button" class="toggle-password" (click)="togglePassword()">

                        <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>

                        <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3l18 18"></path>
                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                            <path d="M9.9 4.2A10.5 10.5 0 0 1 12 4c6.5 0 10 8 10 8a18.2 18.2 0 0 1-3.2 4.4"></path>
                            <path d="M6.6 6.6C3.8 8.4 2 12 2 12s3.5 8 10 8a10.8 10.8 0 0 0 4.2-.9"></path>
                        </svg>

                    </button>

                </div>
                <small class="password-hint">Mindestens 6 Zeichen, ein Grossbuchstabe, eine Zahl und ein
                    Sonderzeichen</small>
            </div>

            <button type="submit">Registrieren</button>
        </form>
        <p *ngIf="message" [style.color]="isSuccess ? 'green' : 'red'">{{ message }}</p>
        <p class="switch-link">Schon registriert? <a routerLink="/login">Zum Login</a></p>
    </div>
</div>

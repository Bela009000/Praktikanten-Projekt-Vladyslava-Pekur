<div class="topics-page">

    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="topics-container">
        <div class="top-row">

            <a routerLink="/home" class="back-button">
                ← Zurück zum Hauptmenü
            </a>
        </div>



        <div class="topics-title">
            <h1>Meine Themen</h1>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Thema suchen..." [(ngModel)]="searchTerm" name="searchTerm" />
        </div>

        <div class="loading-state" *ngIf="isLoading">
            Themen werden geladen...
        </div>

        <div class="topic-list" *ngIf="!isLoading">

            <div class="topic-card add-topic-tile" *ngIf="!isAddingTopic" (click)="startAddTopic()">
                <span class="add-icon">+</span>
                <span>Neues Thema</span>
            </div>

            <form class="topic-card add-topic-form-inline" *ngIf="isAddingTopic" (ngSubmit)="addTopic()">
                <input type="text" placeholder="Themenname eingeben..." [(ngModel)]="newTopicName" name="newTopicName"
                    autofocus />
                <div class="add-topic-actions">
                    <button type="submit" class="save-topic-button">Speichern</button>
                    <button type="button" class="cancel-topic-button" (click)="cancelAddTopic()">Abbrechen</button>
                </div>
            </form>

            <div class="topic-card" *ngFor="let topic of filteredTopics">
                <div class="topic-info">

                    <div class="topic-avatar">
                        {{ topic.name.charAt(0).toUpperCase() }}
                    </div>

                    <div>
                        <h2>
                            {{ topic.name }}
                        </h2>

                        <span>
                            {{ getWordCount(topic.id) }} Wörter
                        </span>
                    </div>

                </div>

                <div class="topic-actions">

                    <a [routerLink]="['/topic', topic.id]" class="open-button">
                        Bearbeiten
                    </a>

                    <a [routerLink]="['/lernmodus', topic.id]" class="learning-button">
                        Lernmodus
                    </a>

                    <button type="button" class="delete-button" (click)="deleteTopic(topic.id)">
                        Löschen
                    </button>

                </div>

            </div>

        </div>

        <div class="empty-state" *ngIf="!isLoading && topics.length > 0 && filteredTopics.length === 0">
            <h2>Keine Treffer</h2>
            <p>Es wurde kein Thema mit „{{ searchTerm }}" gefunden.</p>
        </div>

    </div>

</div>
